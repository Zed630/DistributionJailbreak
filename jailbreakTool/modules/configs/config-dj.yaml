experiment_name: claude-3-haiku-20240307-adaptive-advbench-HarmBench
description: 记录能越狱jb_template-v2

#输出路径
"output_dir": &output_dir ""

#logger配置
log_path: *output_dir

#是否加载Checkpoint
load_chickpoint: false

#Data
dataloader:
  benchmark: 
    cls_name: advbench
    config:
      test_prompt_count: 520
  template:
    cls_name: jailbreaktemplate
    config: null

runtime: 
  num_processes: 1
  log_level: INFO
  seed: 42
  timeout: 60

checkpoint_info: 
  model_idx: 0
  attack_idx: 0
  exp_dir: ""
  case_idx: 0

OpenAI_url: &OpenAI_url 
OpenAI_Key: &OpenAI_Key 
  
target_models:
 - model_cls: openai
   model_name: gpt-4.1
   load_config:
     api_key: *OpenAI_Key
     base_url: *OpenAI_url
   gen_config:
      top_p: 1
      temperature: 0
      max_tokens: 512

#Attackers
attacker_config:
  - attacker_cls: dj
    attack_config:
      iteration: 20
      adv_length: 30
      n_tokens_change: 4

defender_config:
  load_defenders: false
  defend_config:
    defender_cls: llamaguard
    defender_models:
      - model_cls: haggingface
        model_name: Llama-Guard-3-8B
        model_path: 
        device: cuda:4

#evaluator
evaluator_config:
  - evaluator_cls: harmbench
    evaluate_config:
      evaluator_models:
        - model_cls: haggingface
          model_name: Llama-3-8B-Instruct
          model_path: 
          device: cuda:5
